name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Every build must belong to a model namespace (see AGENTS.md).
  SRSP_AI_MODEL: ci

jobs:
  windows-ucrt64:
    name: windows / UCRT64 (GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-catch
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-tinyxml2
            mingw-w64-ucrt-x86_64-eigen3
            mingw-w64-ucrt-x86_64-xxhash
            mingw-w64-ucrt-x86_64-protobuf
            mingw-w64-ucrt-x86_64-grpc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-jsonschema
            mingw-w64-ucrt-x86_64-python-yaml

      - name: configure
        run: |
          # setup-msys2 installs outside C:/msys64, so override the paths that
          # the local presets pin for cross-toolchain reproducibility.
          cmake --preset win-ucrt64-debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DPython3_EXECUTABLE="$(cygpath -w "$(which python)")" \
            -DSRSP_MODULE_TEST_DIR=deepseek/ModuleTest

      - name: build
        run: cmake --build --preset win-ucrt64-debug

      - name: test
        run: ctest --preset win-ucrt64-debug --output-on-failure

  docs:
    name: docs and data files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-yaml
      - name: check json, yaml and markdown links
        run: python3 tests/docs/check_docs.py
